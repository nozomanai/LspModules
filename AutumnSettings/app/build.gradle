plugins {
    id "com.android.application"
}

android {
    namespace "com.autumn.settings"
    compileSdk 35

    defaultConfig {
        applicationId "com.autumn.settings"
        minSdk 33
        targetSdk 35
        versionCode 7
        versionName "1.6"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

dependencies {
    compileOnly project(":xposed-stub")
}
